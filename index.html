<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herramientas Prolub</title>
<meta name="description" content="Centro de herramientas comerciales de Prolub.">
<meta name="theme-color" content="#2C0C31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herramientas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
       background:radial-gradient(120% 90% at 85% 0%,rgba(181,103,159,.35),transparent 55%),
                  radial-gradient(90% 70% at 0% 100%,rgba(226,0,26,.16),transparent 60%),
                  linear-gradient(160deg,#2A0B30 0%,#170619 55%,#10050F 100%) fixed;
       min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:calc(32px + env(safe-area-inset-top)) 24px calc(70px + env(safe-area-inset-bottom));text-align:center;overflow-x:hidden}
  .ring{position:fixed;left:50%;top:50%;border:1px solid rgba(255,255,255,.07);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
  .r1{width:340px;height:340px}.r2{width:560px;height:560px}.r3{width:820px;height:820px}
  .logo{width:104px;height:104px;border-radius:30px;box-shadow:0 18px 50px rgba(0,0,0,.45);position:relative}
  .lanzando .logo{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.05)}}
  h1{font-family:"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;font-weight:300;font-size:38px;letter-spacing:-.6px;margin-top:26px;position:relative}
  p.sub{font-size:15px;color:rgba(255,255,255,.72);margin-top:10px;max-width:360px;line-height:1.55;position:relative}
  .acciones{display:flex;flex-direction:column;gap:10px;margin-top:30px;width:100%;max-width:300px;position:relative}
  .btn{border:none;border-radius:999px;padding:15px 22px;font:700 15px Arial,sans-serif;cursor:pointer;text-decoration:none;display:block}
  .btn.primario{background:#fff;color:#3B0B3F;box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .btn.primario:hover{transform:translateY(-1px)}
  .btn.sec{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
  .guia{margin-top:22px;max-width:360px;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 20px;text-align:left;position:relative}
  .guia b.t{display:block;font-size:14px;margin-bottom:8px}
  .guia ol{padding-left:20px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.85)}
  .guia ol b{color:#fff}
  .estado{margin-top:18px;font-size:14px;color:rgba(255,255,255,.8);position:relative;min-height:20px}
  .bar{width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);margin:26px auto 0;overflow:hidden;position:relative}
  .bar::after{content:"";position:absolute;left:-40%;top:0;bottom:0;width:40%;border-radius:4px;background:linear-gradient(90deg,transparent,#B5679F,#fff);animation:run 1.2s ease-in-out infinite}
  @keyframes run{to{left:100%}}
  .pie{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45)}
  .hidden{display:none !important}
  iframe.app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F5F0F5;z-index:5}
  @media(prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
  <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
  <img class="logo" src="icons/icon-192.png" alt="Herramientas Prolub">
  <h1 id="titulo">Herramientas Prolub</h1>
  <p class="sub" id="sub">Todas tus herramientas comerciales en una sola app, a un toque desde tu inicio o escritorio.</p>

  <div class="acciones" id="acciones">
    <button type="button" class="btn primario" id="btnInstalar">Instalar app</button>
    <a class="btn sec" id="btnAbrir" href="#">Abrir sin instalar</a>
  </div>
  <div class="guia hidden" id="guia"></div>
  <div class="estado" id="estado" role="status" aria-live="polite"></div>
  <div class="bar hidden" id="bar"></div>
  <div class="pie">Prolub S.A.S. · Gulf Oil Colombia</div>

<script src="config.js"></script>
<script>
  var CFG = window.HERRAMIENTAS_CONFIG || {};
  var $ = function(id){ return document.getElementById(id); };
  var aviso = null;   // evento de instalación del navegador (Chrome, Edge, Android)

  function urlApp(){
    var u = String(CFG.appUrl || '');
    if (!/^https:\/\/script\.google\.com\//.test(u)) return '';
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'origen=app';
  }
  function enApp(){
    try { if (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches) return true; } catch(e){}
    return !!navigator.standalone || /[?&]app=1\b/.test(location.search);
  }
  function plataforma(){
    var ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document)) return 'ios';
    if (/Android/i.test(ua)) return 'android';
    return /Edg\//.test(ua) ? 'edge' : 'pc';
  }

  /* ---------- abrir el Centro de Herramientas ---------- */
  function abrir(){
    var u = urlApp();
    if (!u){ $('estado').textContent = 'Falta configurar la dirección de la app (config.js). Avísale al administrador.'; return; }
    document.body.classList.add('lanzando');
    $('acciones').classList.add('hidden'); $('guia').classList.add('hidden');
    $('sub').textContent = 'Abriendo tus herramientas…';
    $('bar').classList.remove('hidden');
    var modo = CFG.modo || 'auto';
    // Pantalla completa = el Centro se muestra DENTRO de la app. Solo se usa cuando la app está instalada;
    // en iPhone Safari bloquea la sesión de Google dentro de la app, así que allí se abre directo.
    if (modo === 'redirigir' || !enApp() || (modo === 'auto' && plataforma() === 'ios')) { location.replace(u); return; }
    incrustar(u);
  }

  /* ---------- pantalla completa (el Centro dentro de la app) con respaldo automático ---------- */
  var cargado = false, marco = null;
  function incrustar(u){
    marco = document.createElement('iframe');
    marco.className = 'app hidden'; marco.src = u; marco.title = 'Herramientas Prolub';
    marco.allow = 'clipboard-write';
    document.body.appendChild(marco);
    setTimeout(function(){ if (!cargado) respaldo(u); }, 12000);   // sin respuesta: casi siempre falta la sesión de Google
  }
  // El Centro avisa con postMessage cuando cargó (ver Index.html de Apps Script)
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.app !== 'herramientas-prolub' || !marco) return;
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(e.origin)) return;
    cargado = true;
    marco.classList.remove('hidden');
  });
  function respaldo(u){
    if (marco){ marco.remove(); marco = null; }
    document.body.classList.remove('lanzando');
    $('bar').classList.add('hidden');
    $('sub').textContent = 'No pudimos abrir tus herramientas dentro de la app. Suele pasar cuando tu sesión de Google no está iniciada en este navegador.';
    $('acciones').innerHTML = '<a class="btn primario" href="' + u + '">Continuar</a>' +
                              '<button type="button" class="btn sec" onclick="location.reload()">Reintentar</button>';
    $('acciones').classList.remove('hidden');
  }
  $('btnAbrir').onclick = function(e){ e.preventDefault(); abrir(); };

  /* ---------- instalar ---------- */
  var GUIAS = {
    ios: ['Hazlo <b>en esta página</b> (la morada), abierta en <b>Safari</b>.', 'Toca <b>Compartir</b> (el cuadro con la flecha hacia arriba).', 'Elige <b>Agregar a inicio</b>, deja <b>Abrir como app web</b> activado y toca <b>Agregar</b>.', 'Si ya tenías un acceso sin logo, bórralo antes.'],
    android: ['Toca el menú <b>⋮</b> de Chrome.', 'Elige <b>Instalar app</b> (o <b>Agregar a la pantalla principal</b> → <b>Instalar</b>).'],
    pc: ['En la barra de direcciones, toca el ícono <b>Instalar</b> (pantalla con flecha), o abre el menú <b>⋮</b>.', 'Elige <b>Instalar Herramientas Prolub</b> y confirma.'],
    edge: ['Abre el menú <b>…</b> de Edge.', 'Elige <b>Aplicaciones</b> → <b>Instalar Herramientas Prolub</b> y confirma.']
  };
  function guia(){
    var p = plataforma();
    $('guia').innerHTML = '<b class="t">Así la instalas</b><ol>' + GUIAS[p].map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>';
    $('guia').classList.remove('hidden');
  }
  var esperando = [];
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); aviso = e;
    $('btnInstalar').textContent = 'Instalar app';
    esperando.splice(0).forEach(function(f){ f(); });
  });
  function lanzarInstalacion(){
    aviso.prompt();
    aviso.userChoice.then(function(r){
      if (r.outcome !== 'accepted') $('estado').textContent = 'Instalación cancelada. Puedes intentarlo de nuevo cuando quieras.';
      aviso = null;
    });
  }
  // Un solo toque: abre el cuadro nativo de instalación del navegador (Chrome, Edge, Android).
  $('btnInstalar').onclick = function(){
    if (aviso) return lanzarInstalacion();
    if (plataforma() === 'ios') return guia();          // iPhone no permite instalar por botón
    $('estado').textContent = 'Preparando la instalación…';
    var listo = false;
    esperando.push(function(){ listo = true; $('estado').textContent = ''; lanzarInstalacion(); });
    setTimeout(function(){
      if (listo) return;
      $('estado').textContent = 'Si ya la instalaste, ábrela desde tu inicio o escritorio. Si no, sigue estos pasos:';
      guia();
    }, 2500);
  };
  window.addEventListener('appinstalled', function(){
    $('guia').classList.add('hidden');
    $('estado').textContent = 'Listo. Ya tienes Herramientas Prolub en tu equipo: ábrela desde tu inicio o escritorio.';
  });

  /* ---------- arranque ---------- */
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  if (enApp()) abrir();
  else if (plataforma() === 'ios'){ $('btnInstalar').textContent = 'Cómo instalarla'; if (/[?&]instalar=1\b/.test(location.search)) guia(); }
</script>
</body>
</html>
